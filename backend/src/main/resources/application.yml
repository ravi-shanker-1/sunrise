server:
  port: 8080

spring:
  application:
    name: techpulse-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/techpulse
    username: ${DB_USERNAME:techpulse}
    password: ${DB_PASSWORD:techpulse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: redis

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

techpulse:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-secure-256-bit-key-in-production-env}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

logging:
  level:
    com.techpulse: DEBUG
    org.springframework.security: INFO
